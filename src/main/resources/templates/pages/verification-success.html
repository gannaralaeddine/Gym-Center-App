
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compte v&eacute;rifi&eacute; - Gym Center</title>
    <!-- autoRedirect:true enables meta refresh to Angular login -->
    <script type="application/json" id="redirect-config">{"autoRedirect":{{autoRedirect}},"delay":{{redirectDelaySeconds}},"url":"{{redirectUrl}}"}</script>
</head>
<body style="margin:0;padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,{{backgroundColor}} 0%,#e2e8f0 100%);font-family:'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="padding:24px;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;background:{{cardBackgroundColor}};border-radius:20px;box-shadow:0 20px 50px rgba(15,23,42,0.12);overflow:hidden;">
                <tr>
                    <td style="background-color:{{primaryColor}};padding:32px;text-align:center;">
                        <div style="width:72px;height:72px;margin:0 auto 16px auto;background:rgba(255,255,255,0.2);border-radius:50%;line-height:72px;font-size:36px;color:{{buttonTextColor}};">&#10003;</div>
                        <h1 style="margin:0;color:{{buttonTextColor}};font-size:24px;font-weight:700;">Compte v&eacute;rifi&eacute;</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 32px;text-align:center;">
                        <p style="margin:0 0 12px 0;font-size:18px;color:{{textColor}};font-weight:600;">F&eacute;licitations{{userName}} !</p>
                        <p style="margin:0 0 28px 0;font-size:15px;line-height:1.7;color:{{mutedTextColor}};">
                            Votre compte a &eacute;t&eacute; activ&eacute; avec succ&egrave;s. Vous pouvez maintenant vous connecter &agrave; l'application.
                        </p>
                        <a href="{{loginUrl}}" id="login-button"
                           style="display:inline-block;background-color:{{buttonColor}};color:{{buttonTextColor}};text-decoration:none;padding:14px 40px;border-radius:10px;font-size:16px;font-weight:700;">
                            Se connecter
                        </a>
                        <p id="redirect-hint" style="margin:20px 0 0 0;font-size:13px;color:{{mutedTextColor}};display:none;"></p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px 24px 32px;text-align:center;border-top:1px solid #e2e8f0;">
                        <p style="margin:0;font-size:12px;color:{{mutedTextColor}};">&copy; {{year}} Gym Center</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
<script>
(function () {
    var configElement = document.getElementById('redirect-config');
    if (!configElement) return;
    var config = JSON.parse(configElement.textContent);
    if (!config.autoRedirect || !config.url) return;
    var hint = document.getElementById('redirect-hint');
    if (hint) {
        hint.style.display = 'block';
        hint.textContent = 'Redirection vers la page de connexion dans ' + config.delay + ' secondes...';
    }
    setTimeout(function () { window.location.href = config.url; }, (config.delay || 5) * 1000);
})();
</script>
</body>
</html>
