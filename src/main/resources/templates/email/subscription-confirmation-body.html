<tr>
    <td style="padding:36px 32px 12px 32px;">
        <h2 style="margin:0 0 16px 0;font-size:22px;color:{{textColor}};font-weight:700;">{{headline}}</h2>
        <p style="margin:0 0 14px 0;font-size:16px;line-height:1.7;color:{{textColor}};">Bonjour <strong>{{userName}}</strong>,</p>
        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.7;color:{{mutedTextColor}};">{{introText}}</p>
    </td>
</tr>
<tr>
    <td style="padding:0 32px 20px 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="background-color:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;">
            <tr>
                <td style="padding:20px 24px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="padding:8px 0;font-size:13px;color:{{mutedTextColor}};font-weight:600;width:40%;">Activit&eacute;</td>
                            <td style="padding:8px 0;font-size:15px;color:{{textColor}};font-weight:700;">{{activityName}}</td>
                        </tr>
                        <tr>
                            <td style="padding:8px 0;font-size:13px;color:{{mutedTextColor}};font-weight:600;border-top:1px solid #e2e8f0;">D&eacute;but</td>
                            <td style="padding:8px 0;font-size:15px;color:{{textColor}};border-top:1px solid #e2e8f0;">{{startDate}}</td>
                        </tr>
                        <tr>
                            <td style="padding:8px 0;font-size:13px;color:{{mutedTextColor}};font-weight:600;border-top:1px solid #e2e8f0;">Fin</td>
                            <td style="padding:8px 0;font-size:15px;color:{{textColor}};border-top:1px solid #e2e8f0;">{{endDate}}</td>
                        </tr>
                        <tr>
                            <td style="padding:8px 0;font-size:13px;color:{{mutedTextColor}};font-weight:600;border-top:1px solid #e2e8f0;">Prix</td>
                            <td style="padding:8px 0;font-size:15px;color:{{primaryColor}};font-weight:700;border-top:1px solid #e2e8f0;">{{subscriptionPrice}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </td>
</tr>
<tr>
    <td align="center" style="padding:8px 32px 12px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td align="center" style="border-radius:8px;background-color:{{buttonColor}};">
                    <a href="{{actionUrl}}" target="_blank"
                       style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:700;color:{{buttonTextColor}};text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;">
                        {{ctaLabel}}
                    </a>
                </td>
            </tr>
        </table>
    </td>
</tr>
<tr>
    <td style="padding:8px 32px 28px 32px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:{{mutedTextColor}};">
            Profitez de toutes nos installations et services pendant la p&eacute;riode de votre abonnement.
        </p>
        <p style="margin:16px 0 0 0;font-size:13px;color:{{mutedTextColor}};">
            Questions ? <a href="mailto:{{supportEmail}}" style="color:{{primaryColor}};">{{supportEmail}}</a>
        </p>
    </td>
</tr>
