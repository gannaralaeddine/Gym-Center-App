<tr>
    <td style="padding:36px 32px 12px 32px;">
        <h2 style="margin:0 0 16px 0;font-size:22px;color:{{textColor}};font-weight:700;">{{headline}}</h2>
        <p style="margin:0 0 14px 0;font-size:16px;line-height:1.7;color:{{textColor}};">Bonjour <strong>{{userName}}</strong>,</p>
        <p style="margin:0 0 14px 0;font-size:15px;line-height:1.7;color:{{mutedTextColor}};">{{introText}}</p>
    </td>
</tr>
<tr>
    <td align="center" style="padding:12px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;border:2px dashed {{primaryColor}};border-radius:12px;">
            <tr>
                <td style="padding:24px 40px;font-size:34px;font-weight:700;letter-spacing:10px;color:{{primaryColor}};font-family:Consolas,Monaco,monospace;text-align:center;">
                    {{verificationCode}}
                </td>
            </tr>
        </table>
    </td>
</tr>
<tr>
    <td style="padding:8px 32px 28px 32px;">
        <p style="margin:0 0 12px 0;font-size:14px;line-height:1.6;color:{{mutedTextColor}};">
            Ce code expire dans <strong>{{expiryMinutes}} minutes</strong>.
        </p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:{{mutedTextColor}};">
            Si vous n'avez pas demand&eacute; cette r&eacute;initialisation, ignorez cet e-mail.
            Pour toute assistance : <a href="mailto:{{supportEmail}}" style="color:{{primaryColor}};">{{supportEmail}}</a>
        </p>
    </td>
</tr>
