<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>{{appName}}</title>
</head>
<body style="margin:0;padding:0;background-color:{{backgroundColor}};font-family:'Segoe UI',Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{backgroundColor}};padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:{{cardBackgroundColor}};border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
                <tr>
                    <td style="background-color:{{primaryColor}};padding:28px 32px;text-align:center;">
                        <h1 style="margin:0;color:{{buttonTextColor}};font-size:26px;font-weight:700;letter-spacing:0.5px;">{{appName}}</h1>
                    </td>
                </tr>
                {{emailBody}}
                <tr>
                    <td style="padding:20px 32px 28px 32px;background-color:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;">
                        <p style="margin:0 0 8px 0;font-size:13px;color:{{mutedTextColor}};line-height:1.6;">{{footerText}}</p>
                        <p style="margin:0;font-size:12px;color:{{mutedTextColor}};">&copy; {{year}} {{appName}}. Tous droits r&eacute;serv&eacute;s.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
