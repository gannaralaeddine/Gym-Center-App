<tr>
    <td style="padding:36px 32px 12px 32px;">
        <h2 style="margin:0 0 16px 0;font-size:22px;color:{{textColor}};font-weight:700;">{{headline}}</h2>
        <p style="margin:0 0 14px 0;font-size:16px;line-height:1.7;color:{{textColor}};">Bonjour <strong>{{userName}}</strong>,</p>
        <p style="margin:0 0 14px 0;font-size:15px;line-height:1.7;color:{{mutedTextColor}};">{{introText}}</p>
    </td>
</tr>
<tr>
    <td align="center" style="padding:8px 32px 12px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td align="center" style="border-radius:8px;background-color:{{buttonColor}};">
                    <a href="{{actionUrl}}" target="_blank"
                       style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:700;color:{{buttonTextColor}};text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;">
                        {{ctaLabel}}
                    </a>
                </td>
            </tr>
        </table>
    </td>
</tr>
<tr>
    <td style="padding:8px 32px 28px 32px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:{{mutedTextColor}};">
            Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :<br/>
            <a href="{{actionUrl}}" style="color:{{primaryColor}};word-break:break-all;">{{actionUrl}}</a>
        </p>
        <p style="margin:16px 0 0 0;font-size:13px;color:{{mutedTextColor}};">
            Besoin d'aide ? Contactez-nous : <a href="mailto:{{supportEmail}}" style="color:{{primaryColor}};">{{supportEmail}}</a>
        </p>
    </td>
</tr>
